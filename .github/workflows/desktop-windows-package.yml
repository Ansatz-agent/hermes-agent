name: Desktop Windows NSIS package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and verify Windows x64 NSIS
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
      NPM_CONFIG_REPLACE_REGISTRY_HOST: always
      UV_DEFAULT_INDEX: https://mirrors.ustc.edu.cn/pypi/simple
      HERMES_UV_FALLBACK_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node 26.7.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.7.0
          cache: npm

      - name: Set up uv 0.12.5
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Pin npm and install locked dependencies
        shell: pwsh
        run: |
          npm install --global npm@11.19.0
          if ((node --version) -ne 'v26.7.0') { throw 'Node version mismatch' }
          if ((npm --version) -ne '11.19.0') { throw 'npm version mismatch' }
          uv python install 3.13.15
          npm ci

      - name: Run product contracts
        shell: pwsh
        run: |
          npm run test:desktop:windows-contract
          npm exec --workspace apps/desktop vitest run scripts/windows-auth-toolchain.integration.test.mjs
          npm run typecheck --workspace apps/desktop

      - name: Fetch pinned PortableGit build input
        shell: pwsh
        run: |
          $sourceDir = 'apps/desktop/build/package-input-cache'
          $sourcePath = Join-Path $sourceDir 'PortableGit-2.55.0.3-64-bit.7z.exe'
          New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
          Invoke-WebRequest `
            -Uri 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.3/PortableGit-2.55.0.3-64-bit.7z.exe' `
            -OutFile $sourcePath `
            -UseBasicParsing
          $expected = 'ab00566336b5472120f9a52d34f2e79c5406535792acb0548001ffd0bd090e5d'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'PortableGit SHA-256 mismatch' }

      - name: Build with the local product command
        shell: pwsh
        run: npm run dist:win:nsis --workspace apps/desktop

      - name: Reject CI files, credential drivers, and raw logs
        shell: pwsh
        run: |
          $resources = 'apps/desktop/release/win-unpacked/resources'
          $asar = Join-Path $resources 'app.asar'
          node apps/desktop/scripts/package-audit.mjs `
            --resources $resources `
            --expected-commit $env:GITHUB_SHA
          node --input-type=module -e `
            "import {listPackage} from '@electron/asar'; const entries=listPackage(process.argv[1]); const bad=entries.find(x=>/(^|\/)\.github\/|credential-login|\.log$/i.test(x)); if(bad) throw new Error('forbidden ASAR entry: '+bad)" `
            $asar
          $archive = Join-Path $resources 'bootstrap/hermes-backend.tar.gz'
          $badArchive = tar.exe -tzf $archive | Where-Object {
            $_ -match '(^|/)\.github/' -or $_ -match 'credential-login' -or $_ -match '\.log$'
          } | Select-Object -First 1
          if ($badArchive) { throw "forbidden backend entry: $badArchive" }

      - name: Run clean installed-app smoke
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $installer = Get-ChildItem 'apps/desktop/release/*-win-x64.exe' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          pwsh -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-desktop-windows-install.ps1 `
            -InstallerPath $installer.FullName `
            -ExpectedCommit $env:GITHUB_SHA `
            -ExpectedVersion $version `
            -LogPath (Join-Path $env:RUNNER_TEMP 'hermes-windows-smoke.log')

      - name: Credentialed installed-app login
        shell: pwsh
        env:
          HERMES_E2E_USERNAME: ${{ secrets.HERMES_E2E_USERNAME }}
          HERMES_E2E_PASSWORD: ${{ secrets.HERMES_E2E_PASSWORD }}
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $installer = Get-ChildItem 'apps/desktop/release/*-win-x64.exe' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          pwsh -NoProfile -ExecutionPolicy Bypass `
            -File scripts/test-desktop-windows-install.ps1 `
            -InstallerPath $installer.FullName `
            -ExpectedCommit $env:GITHUB_SHA `
            -ExpectedVersion $version `
            -LogPath (Join-Path $env:RUNNER_TEMP 'hermes-windows-credential-smoke.log') `
            -RunCredentialE2E `
            -AuthLogPath (Join-Path $env:RUNNER_TEMP 'hermes-windows-credential-auth.log') `
            -StartupTimeoutSeconds 180

      - name: Write sanitized artifact report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'apps/desktop/build/reports' | Out-Null
          $installer = Get-ChildItem 'apps/desktop/release/*-win-x64.exe' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          $report = [ordered]@{
            schemaVersion = 1
            commit = $env:GITHUB_SHA
            version = (node -p "require('./apps/desktop/package.json').version")
            platform = 'windows'
            arch = 'x64'
            artifact = $installer.Name
            sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
            sensitiveEvidenceRecorded = $false
          }
          $report | ConvertTo-Json | Set-Content `
            -LiteralPath 'apps/desktop/build/reports/windows-package.json' `
            -Encoding UTF8

      - name: Upload installer and sanitized report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hermes-windows-nsis-${{ github.sha }}
          path: |
            apps/desktop/release/*-win-x64.exe
            apps/desktop/build/reports/windows-package.json
          if-no-files-found: error
          retention-days: 14
